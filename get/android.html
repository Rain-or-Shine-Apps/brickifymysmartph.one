<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opening Google Play… - Brickify</title>
  <meta name="robots" content="noindex"/>
  <!-- Store buttons link here so Umami records a store click as a pageview (funnels only take pages).
       The pause gives the pageview time to send; the refresh and link are fallbacks. -->
  <meta http-equiv="refresh" content="3; url=https://play.google.com/store/apps/details?id=com.rainorshineapps.brickify"/>
  <link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FFFBF4; color: #3c2a22; font: 700 18px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
    a { color: #83412C; }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="e0d84b60-73f0-4238-8816-88b297d3b799" data-domains="brickifymysmartph.one"></script>
  <script>setTimeout(function () { location.replace('https://play.google.com/store/apps/details?id=com.rainorshineapps.brickify'); }, 1000);</script>
</head>
<body>
  <p>Opening Google Play…<br><a href="https://play.google.com/store/apps/details?id=com.rainorshineapps.brickify">Tap here if nothing happens</a></p>
</body>
</html>
